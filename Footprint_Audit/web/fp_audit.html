    <body>
        <style type="text/css">
///FP_AUDIT_CSS///
        </style>
        
        <div> 
            <button 
                id = "settings-btn"
                onclick = "{
                    if (document.getElementById('settings-btn').style.rotate == '-180deg'){
                        document.getElementById('settings-btn').style.rotate = '0deg';
                        document.getElementById('settings-overlay').style.width = '0%';
                    }
                    else {
                        document.getElementById('settings-btn').style.rotate = '-180deg';
                        document.getElementById('settings-overlay').style.width = '40%';
                    }
                }"
                >                   
                <<
            </button>
            <div id = "settings-overlay">
                Silkscreen
                <br>
                <button
                    id = "toggle-SilkS-btn"
                    onclick = "{
                        KonvaStages.forEach(stage => {
                            let layers = stage.find('.content_SilkS');
                            layers.forEach(e => e.visible(!e.visible()));
                        });
                        
                    }"
                    style = "margin:10px;padding:5px;"
                    >
                Toggle
                </button>
                <input 
                    type = "color"
                    id = "colorPick-SilkS"
                    style = "margin:10px;"
                    value = "#FFFFFF"
                    oninput = "{
                        fp_strokeColor_SilkS = document.querySelector('#colorPick-SilkS').value;
                        KonvaStages.forEach(stage => {
                            let layers = stage.find('.content_SilkS');
                            layers.forEach(layer => {
                                layer.getChildren().forEach(e => {
                                    e.stroke(fp_strokeColor_SilkS);
                                    if (e.fill() != undefined)
                                        e.fill(fp_strokeColor_SilkS);
                                });
                                layer.batchDraw();
                            });
                        });
                    }"
                    />
                <br>
                Courtyard
